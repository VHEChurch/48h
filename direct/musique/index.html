<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Musique · 48 heures de prière</title>
<link rel="icon" href="../../img/icone-32.png">
<style>
@font-face{font-family:"Barlow Condensed";font-style:italic;font-weight:700;src:url(../../fonts/barlow-condensed-italic-700.woff2) format("woff2")}
html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#0d0026;color:#fff;font:italic 700 20px/1.2 "Barlow Condensed","Arial Narrow",sans-serif}
#boite{flex:1;min-height:200px;min-width:200px}iframe{display:block;width:100%;height:100%;border:0}p{margin:0;padding:10px 14px;text-align:center;color:#d6c6f2}
</style>
</head>
<body>
<div id="boite"><div id="lecteur"></div></div>
<p>Laissez cette fenêtre ouverte, derrière l’écran de prière.</p>
<script src="../musiques.js?v=2"></script>
<script>
// Fenêtre séparée : le lecteur officiel YouTube joue la playlist en boucle ; l'écran de prière la pilote.
const canal = new BroadcastChannel('48h-musique'); let l = null, pret = false, vol = 60, voulu = true;
try { vol = Number(localStorage.getItem('48h-vol') || 60); } catch (e) { /* stockage fermé */ }
window.onYouTubeIframeAPIReady = () => {
  const n = MUSIQUES.nombre, h = Math.floor((Date.now() - Date.UTC(2026, 10, 26, 6)) / 3600000);
  l = new YT.Player('lecteur', { width: '100%', height: '100%', playerVars: { listType: 'playlist', list: MUSIQUES.playlist, index: ((h % n) + n) % n, autoplay: 1, loop: 1, rel: 0, playsinline: 1, origin: location.origin }, events: {
    onReady: () => { pret = true; l.setVolume(vol); l.setLoop(true); if (voulu) l.playVideo(); }, onError: () => setTimeout(() => l.nextVideo(), 1500), onStateChange: (e) => canal.postMessage({ etat: e.data }) } });
};
canal.onmessage = ({ data: d }) => { if (!pret && d.vol === undefined) return; if (d.vol !== undefined) { vol = d.vol; if (pret) l.setVolume(vol); } if (d.cmd === 'suivante') l.nextVideo(); if (d.cmd === 'pause') { voulu = false; l.pauseVideo(); } if (d.cmd === 'lire') { voulu = true; l.playVideo(); } if (d.cmd === 'fermer') close(); };
setInterval(() => { canal.postMessage({ vivant: 1 }); if (pret && voulu) { const e = l.getPlayerState(); if (e === 0 || e === 5 || e === -1) l.playVideo(); } }, 4000);
addEventListener('pagehide', () => canal.postMessage({ ferme: 1 }));
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.append(s);
</script>
</body>
</html>
